plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
    id "app.cash.paparazzi"
}
android {
    namespace "pz.render"
    compileSdk 34
    defaultConfig { minSdk 21 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
}
dependencies {
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    // v1.9.0: the logic editor's source sheet (sora-editor, as the IDE ships it)
    implementation "io.github.Rosemoe.sora-editor:editor:0.17.2"
    implementation "io.github.Rosemoe.sora-editor:language-java:0.17.2"
    implementation "io.github.Rosemoe.sora-editor:language-textmate:0.17.2"
    testImplementation "junit:junit:4.13.2"
}
