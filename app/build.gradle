plugins {
    // AGP 9 compiles the Kotlin sources itself (built-in Kotlin): no kotlin-android plugin
    id "com.android.application"
}

android {
    compileSdk = 37

    // Gradle 9 has no Project.exec: git runs through the providers API
    def gitCommitHash = providers.exec {
        commandLine "git", "rev-parse", "HEAD"
    }.standardOutput.asText.get().trim()

    def getCommitHash = { ->
        return providers.exec {
            commandLine "git", "rev-parse", "--short", "HEAD"
        }.standardOutput.asText.get().trim()
    }

    defaultConfig {
        applicationId "com.sketchware.ai"
        namespace = "com.sketchware.remod"
        // v1.9.0: Android 15 (35). The themes opt out of the forced edge-to-edge and the manifest keeps onBackPressed
        // (enableOnBackInvokedCallback="false"): the editors save there. 36+ removes the edge-to-edge opt-out (roadmap).
        targetSdk = 35
        versionCode 195
        versionName "v1.9.5-" + getCommitHash()

        buildConfigField("String", "GIT_HASH", "\"${gitCommitHash}\"")

        buildConfigField("String", "FLAVOR_NAME_WITH_AABS", "\"minApi26\"")
        buildConfigField("String", "FLAVOR_NAME_WITHOUT_AABS", "\"minApi21\"")

        buildConfigField("String", "VERSION_NAME_WITHOUT_FLAVOR", "\"v1.0.0-${getCommitHash()}\"")

        buildConfigField("String", "CRASH_REPORT_WEBHOOK_URL", "\"${System.getenv("CRASH_REPORT_WEBHOOK_URL")}\"")
    }

    flavorDimensions "api"
    productFlavors {
        minApi26 {
            dimension "api"
            minSdkVersion 26
            versionNameSuffix "-minApi26"
        }

        minApi21 {
            dimension "api"
            minSdkVersion 21
            versionNameSuffix "-minApi21"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        // aapt2 ships as jniLibs/<abi>/libaapt2.so. Legacy packaging makes the installer
        // extract it to nativeLibraryDir as an executable file; without it (the default for
        // minSdk 23+) the library stays inside the APK and cannot be run.
        jniLibs.useLegacyPackaging = true
        // The binaries are already stripped static executables, not JNI libraries.
        jniLibs.keepDebugSymbols += "**/libaapt2.so"
        resources.excludes += "license/*"
        resources.excludes += "META-INF/DEPENDENCIES"
        resources.pickFirsts += "api_database/*"
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
    }

    androidResources {
        additionalParameters "--stable-ids", "${rootDir}/public-stable-ids.txt"
    }

    signingConfigs {
        debug {
            storeFile file("../testkey.keystore")
            storePassword "testkey"
            keyAlias "testkey"
            keyPassword "testkey"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        // kotlin-stdlib 1.7.10 at run time (see gradle.properties); 2.0 is the oldest version Kotlin 2.4 compiles:
        // the compiled classes must only call stdlib 1.7.10 members (checked by tools/linkcheck/kotlin_stdlib.py)
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"], exclude: "proguard-base-7.2.2.jar")

    implementation "androidx.annotation:annotation:1.4.0"
    implementation "com.android.tools:annotations:30.2.2"
    implementation "com.google.guava:guava:31.1-jre"

    def codeEditorVersion = "0.17.2"
    def editorGroupId = "io.github.Rosemoe.sora-editor"

    implementation "$editorGroupId:editor:$codeEditorVersion"
    implementation "$editorGroupId:language-java:$codeEditorVersion"
    implementation "$editorGroupId:language-textmate:$codeEditorVersion"

    implementation "de.hdodenhof:circleimageview:3.1.0"
    implementation "com.github.angads25:filepicker:1.1.1"

    minApi26Implementation "com.android.tools.build:bundletool:1.18.3"
    //noinspection GradleDependency copied from above dependency for not just runtime access
    minApi26Implementation "com.google.protobuf:protobuf-java:3.22.3"
    //noinspection GradleDependency
    implementation "com.android.tools:sdklib:25.3.0", { exclude group: "com.intellij", module: "annotations" }
    implementation "com.android.tools:r8:8.13.25"

    implementation "com.google.code.gson:gson:2.9.0"
    implementation "com.madgag:scpkix-jdk15on:1.47.0.2"

    //noinspection GradleDependency
    implementation "com.squareup.okhttp3:okhttp:4.10.0"
    //noinspection GradleDependency
    implementation "com.squareup.okio:okio:3.1.0"

    // TODO: use proguard-core dependency when duplicate class issue has been fixed
    minApi21Implementation "net.sf.proguard:proguard-base:6.0.3"
    minApi26Implementation files('libs/proguard-base-7.2.2.jar')
    minApi26Implementation 'com.guardsquare:proguard-core:9.0.2'
    minApi26Implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.10'

    //noinspection GradleDependency
    minApi21Implementation "org.eclipse.jdt:ecj:3.13.0"
    minApi26Implementation "org.eclipse.jdt:ecj:3.26.0"

    minApi26Implementation project(path: ":kotlinc")

    implementation "com.github.topjohnwu.libsu:core:5.0.2"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs_nio:2.1.5"
}
